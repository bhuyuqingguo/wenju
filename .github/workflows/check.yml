name: check

on:
  push:
  pull_request:

jobs:
  wenju:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: compile
        run: python -m compileall -q core/wenju_format.py core/fontfallback.py app.py worker.py test_wenju_format.py
      - name: unit
        run: python test_wenju_format.py
