name: check

on:
  push:
  pull_request:

jobs:
  unit:
    # ubuntu-latest is 26.04, and setup-python no longer publishes 3.8 for it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: package file set
        run: python launcher/app_files.py
      - name: compile
        run: python -m compileall -q core/wenju_format.py core/fontfallback.py core/clipboard_import.py core/compose.py core/convert.py core/import_drop.py app.py worker.py preview_model.py test_wenju_format.py test_clipboard.py test_clipboard_invariants.py test_compose.py test_convert.py test_fontfallback.py test_preview.py test_import_drop.py qt_compat.py launcher/app_files.py
      - name: wenju format
        run: python test_wenju_format.py
      - name: clipboard
        run: python -m unittest test_clipboard test_clipboard_invariants -v
      - name: font fallback
        run: python test_fontfallback.py
      - name: conversion
        run: python test_convert.py
      - name: preview
        run: python test_preview.py
      - name: compose
        run: python test_compose.py
