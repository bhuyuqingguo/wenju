name: check
on:
  pull_request:
  push:
jobs:
  light:
    # ubuntu-latest is 26.04, and setup-python no longer publishes 3.8 for it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: conversion tests
        run: python test_convert.py
