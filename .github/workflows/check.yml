name: check

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: compile
        run: python -m compileall -q core/wenju_format.py core/fontfallback.py core/clipboard_import.py core/compose.py app.py worker.py test_wenju_format.py test_clipboard.py test_compose.py qt_compat.py
      - name: wenju format
        run: python test_wenju_format.py
      - name: clipboard
        run: python -m unittest test_clipboard -v
      - name: compose
        run: python test_compose.py
